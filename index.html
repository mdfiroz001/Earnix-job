:root { --primary: #6366f1; --primary-light: #eef2ff; --bg: #f8fafc; }
body { background: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; color: #1e293b; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }

/* Preloader */
#preloader { position:fixed; inset:0; background:#fff; display:flex; align-items:center; justify-content:center; z-index:99999; }
.pre-arc-wrap { position:relative; width:75px; height:75px; }
.pre-arc { position:absolute; inset:0; border-radius:50%; border:4px solid transparent; border-top-color:var(--primary); animation: arcSpin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite; }
.pre-arc:nth-child(2) { inset:12px; border-top-color:#ec4899; animation-duration: 0.9s; animation-direction: reverse; }
.pre-arc:nth-child(3) { inset:24px; border-top-color:#f59e0b; animation-duration: 1.5s; }
@keyframes arcSpin { to { transform:rotate(360deg); } }

/* Sidebar & Overlay */
#side-menu { position:fixed; top:0; left:-320px; width:300px; height:100%; background:#fff; z-index:10000; transition:0.4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 20px 0 60px rgba(0,0,0,0.1); }
#side-menu.open { left:0; }
#menu-overlay { position:fixed; inset:0; background:rgba(15, 23, 42, 0.4); z-index:9999; display:none; backdrop-filter:blur(6px); }

/* Custom Toasts */
#toast-container { position: fixed; top: 20px; right: 20px; z-index: 10000; pointer-events: none; }
.toast-msg { 
    background: #1e293b; color: white; padding: 14px 24px; border-radius: 16px; 
    margin-bottom: 10px; font-weight: 600; font-size: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    display: flex; align-items: center; gap: 10px; animation: slideIn 0.3s ease-out;
}
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* Grid UI */
.video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 28px; padding: 20px; }
@media (max-width: 640px) { .video-grid { grid-template-columns: 1fr; padding: 16px; } }

/* Full Page Detail */

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
/** 
 * CORE MODULE - Encapsulated Advanced Logic
 */
const core = (function() {
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBp1LZR0tj3Y_1XRkAhLHPc5ZC59J8Q5uY",
      authDomain: "moviehunt-f6dfe.firebaseapp.com",
      databaseURL: "https://moviehunt-f6dfe-default-rtdb.firebaseio.com",
      projectId: "moviehunt-f6dfe",
      storageBucket: "moviehunt-f6dfe.firebasestorage.app",
      messagingSenderId: "742383925182",
      appId: "1:742383925182:web:5c629898042d21aa98abef"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const _D = {
        bot: 'viralteravideobot',
        app: 'app',
        url: 'https://go2links.site/',
        code: ''
    };

    let _store = [], _cat = 'All', _srt = 'newest', _pg = 1, _size = 30, _file = null;

    const _init = async () => {
        try {
            // URL কোড সনাক্তকরণ
            const pathParts = window.location.pathname.split('/').filter(p => p);
            _D.code = pathParts.length ? pathParts[pathParts.length - 1] : '';

            // ফায়ারবেস থেকে ক্যাটাগরি এবং ফাইলসমূহ পড়া
            const [cSnapshot, fSnapshot] = await Promise.all([
                db.ref('categories').once('value'),
                db.ref('files').once('value')
            ]);
            
            const catData = cSnapshot.val() || {};
            const categories = Object.keys(catData).map(key => ({ id: key, ...catData[key] }));

            const fileData = fSnapshot.val() || {};
            _store = Object.keys(fileData).map(key => ({ id: key, ...fileData[key] }));

            // ক্যাটাগরি রেন্ডার করা
            const cl = document.getElementById('category-list'), sl = document.getElementById('sidebar-cats');
            categories.forEach(c => {
                cl.innerHTML += `<button onclick="core.setCat('${c.name}')" id="cat-${c.name}" class="cat-chip">${c.name}</button>`;
                sl.innerHTML += `<button onclick="core.setCat('${c.name}'); core.toggleMenu();" class="w-full text-left p-4 text-sm font-bold text-slate-500 hover:bg-slate-50 rounded-2xl transition">${c.name}</button>`;
            });

            _render();
            
            // অটোমেটিক ডিটেইলস পেজ ওপেন (URL প্যারামিটার বা শর্ট কোড অনুযায়ী)
            if(_D.code && _D.code !== 'index.html') {
                const t = _store.find(f => f.short_code === _D.code || f.id == _D.code);
                if(t) core.openDetail(t.id);
            }
        } catch(e) {
            console.error(e);
        } finally { 
            setTimeout(() => { document.getElementById('preloader').style.display = 'none'; }, 800); 
        }
    };

    const _render = () => {
        const g = document.getElementById('files-grid'); g.innerHTML = '';
        let list = _store.filter(f => _cat === 'All' || f.category === _cat);
        
        // অ্যাডভান্সড সর্টিং অ্যালগরিদম
        if(_srt === 'popular') list.sort((a,b) => (b.views || 0) - (a.views || 0));
        else if(_srt === 'random') list.sort(() => Math.random() - 0.5);
        else list.sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));

        const start = (_pg - 1) * _size;
        const pageItems = list.slice(start, start + _size);

        if(pageItems.length === 0) {
            g.innerHTML = `<div class="col-span-full py-20 text-center font-bold text-slate-400">No content found in this category.</div>`;
        }

        pageItems.forEach(f => {
            g.innerHTML += `
            <div class="group cursor-pointer" onclick="core.openDetail('${f.id}')">
                <div class="relative aspect-video rounded-[28px] overflow-hidden bg-slate-200 shadow-sm transition-all group-hover:shadow-2xl group-hover:-translate-y-2">
                    <img src="${f.thumbnailUrl}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                    <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                        <div class="w-12 h-12 bg-white/30 backdrop-blur-md rounded-full flex items-center justify-center text-white"><i class="fas fa-play"></i></div>
                    </div>
                    <div class="absolute bottom-3 right-3 bg-black/60 backdrop-blur-xl text-white px-3 py-1 rounded-xl text-[10px] font-black">${f.duration || 'HD'}</div>
                </div>
                <div class="mt-5 px-1">
                    <h3 class="text-[15px] font-extrabold text-slate-800 line-clamp-2 leading-snug group-hover:text-indigo-600 transition-colors">${f.title}</h3>
                    <div class="flex items-center gap-2 mt-2 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                        <span class="text-indigo-500">${f.category}</span> <span class="w-1 h-1 bg-slate-300 rounded-full"></span> <span>${f.views || 0} views</span>
                    </div>
                </div>
            </div>`;
        });
        _renderPagination(list.length);
    };

    const _renderPagination = (total) => {
        const ctrl = document.getElementById('pagination-ctrl');
        const pages = Math.ceil(total / _size);
        ctrl.innerHTML = ''; if(pages <= 1) return;
        
        for(let i=1; i<=pages; i++) {
            ctrl.innerHTML += `<button onclick="core.changePage(${i})" class="w-12 h-12 rounded-2xl font-black text-sm ${i === _pg ? 'bg-indigo-600 text-white shadow-xl shadow-indigo-200' : 'bg-white text-slate-400 border border-slate-200 hover:bg-slate-50'} transition-all">${i}</button>`;
        }
    };

    const _notify = (msg) => {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast-msg';
        toast.innerHTML = `<i class="fas fa-circle-check text-green-400"></i> ${msg}`;
        container.appendChild(toast);
        setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(50px)'; setTimeout(() => toast.remove(), 300); }, 3000);
    };

    return {
        init: _init,
        toggleMenu: (force) => {
            const m = document.getElementById('side-menu'), o = document.getElementById('menu-overlay');
            const open = (force !== undefined) ? force : !m.classList.contains('open');
            m.classList.toggle('open', open);
            o.style.display = open ? 'block' : 'none';
        },
        showToast: _notify,
        openSearch: () => { document.getElementById('search-ov').classList.remove('hidden'); document.getElementById('srchInput').focus(); core.onSrch(''); },
        closeSearch: () => document.getElementById('search-ov').classList.add('hidden'),
        onSrch: (v) => {
            const res = document.getElementById('srch-body'); res.innerHTML = '';
            const hits = v ? _store.filter(f => f.title.toLowerCase().includes(v.toLowerCase())).slice(0, 15) : _store.slice(0, 8);
            hits.forEach(f => {
                res.innerHTML += `
                <div class="flex items-center gap-4 p-4 hover:bg-slate-50 rounded-3xl cursor-pointer transition" onclick="core.openDetail('${f.id}'); core.closeSearch();">
                    <img src="${f.thumbnailUrl}" class="w-24 h-14 object-cover rounded-2xl bg-slate-100 flex-shrink-0">
                    <div class="truncate"><p class="font-bold text-sm text-slate-800 truncate">${f.title}</p></div>
                </div>`;
            });
        },
        openDetail: async (id) => {
            _file = _store.find(f => f.id == id); if(!_file) return;

            // রিয়েলটাইম ভিউজ (Views) সংখ্যা ১ বৃদ্ধি করা
            try {
                const fileRef = db.ref('files/' + id + '/views');
                await fileRef.transaction((currentViews) => (currentViews || 0) + 1);
                _file.views = (_file.views || 0) + 1;
            } catch(e) {
                console.warn("View increment failed", e);
            }

            document.getElementById('d-img').src = _file.thumbnailUrl;
            document.getElementById('d-title').textContent = _file.title;
            document.getElementById('d-desc').textContent = _file.description || 'Watch premium video content instantly.';
            document.getElementById('d-views').textContent = _file.views;
            document.getElementById('d-cat').textContent = _file.category;
            
            const sug = document.getElementById('suggested-list'); sug.innerHTML = '';
            _store.filter(f => f.category === _file.category && f.id !== _file.id).slice(0, 12).forEach(f => {
                sug.innerHTML += `
                <div class="flex gap-4 cursor-pointer group" onclick="core.openDetail('${f.id}')">
                    <img src="${f.thumbnailUrl}" class="w-32 h-20 object-cover rounded-2xl flex-shrink-0 group-hover:ring-2 ring-indigo-500 transition-all">
                    <div class="flex-1 py-1">
                        <h4 class="text-xs font-black text-slate-800 line-clamp-2 group-hover:text-indigo-600 transition-colors">${f.title}</h4>
